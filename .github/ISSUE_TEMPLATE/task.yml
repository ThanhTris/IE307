name: Task
description: Tạo task có phạm vi và acceptance criteria rõ ràng
title: "[TASK-ID] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Mục tiêu
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Phạm vi và non-goals
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner và reviewer
    validations:
      required: true
  - type: input
    id: task_source
    attributes:
      label: Task Markdown / baseline / spec / ADR
      description: Markdown là nguồn trạng thái; ghi đường dẫn task hiện hành, không chỉ issue cũ.
    validations:
      required: true
  - type: textarea
    id: start_dependencies
    attributes:
      label: Start dependencies — cần trước phần độc lập
      description: GM-ID hiện hành có số nhỏ hơn task này, contract/version/evidence đã review; phần được viết sớm với fixture. Không dùng mã cũ hoặc danh sách này thay merge gate.
    validations:
      required: true
  - type: textarea
    id: merge_dependencies
    attributes:
      label: Merge dependencies — cần trước tích hợp và merge
      description: GM-ID hiện hành có số nhỏ hơn task này, API/schema/data/runner thật, PR/merge commit và ref target cần kiểm; bao gồm start deps khi nghiệm thu.
    validations:
      required: true
  - type: textarea
    id: parallel
    attributes:
      label: Task có thể làm song song
      description: Ghi GM-ID cụ thể, owner khác, file/interface/version và phần làm trước/phần chờ tích hợp; được có quan hệ merge trước/sau, không có start trước/sau; hoặc N/A.
    validations:
      required: true
  - type: textarea
    id: patch_test_handoff
    attributes:
      label: Patch plan, test plan và bàn giao
      description: File dự kiến, lệnh kiểm, evidence, task nhận đầu ra; code/native chưa có runner thì không giả đã pass.
    validations:
      required: true
