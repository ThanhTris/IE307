name: Task
description: Tạo task có phạm vi và acceptance criteria rõ ràng
title: "[TASK-ID] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Mục tiêu
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Phạm vi và non-goals
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner và reviewer
    validations:
      required: true
