name: Project documents
permissions:
  contents: read
on:
  workflow_call:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install contract validation tooling (not an app dependency)
        run: python -m pip install --requirement scripts/ci-requirements.txt
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/task_readiness.py --check-docs
      - run: git diff --check
      - name: Report final job state
        if: always()
        uses: ./.github/actions/ci-report
        with:
          name: repository-validation
