name: GM-20 CLI portability
on:
  workflow_call:
permissions:
  contents: read
jobs:
  cli-entrypoint:
    name: Supabase entrypoint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Launches the real platform CLI; no Docker or HTTP assertions are claimed.
      - run: node --test tests/gm20-cli.test.mjs
      - name: Report final job state
        if: always()
        uses: ./.github/actions/ci-report
        with:
          name: cli-${{ matrix.os }}
