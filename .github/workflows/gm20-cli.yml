name: GM-20 CLI portability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli-entrypoint:
    name: Supabase entrypoint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Launches the real platform CLI; no Docker or HTTP assertions are claimed.
      - run: node --test tests/gm20-cli.test.mjs
