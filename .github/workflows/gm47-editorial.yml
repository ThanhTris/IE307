name: GM-47 editorial catalogue
on:
  pull_request:
    paths:
      - '.github/workflows/gm47-editorial.yml'
      - 'data-preparation/editorial/gm47/**'
      - 'data-preparation/scripts/gm47_catalogue.py'
      - 'scripts/gm47_catalogue_check.py'
      - 'tests/test_gm47_catalogue.py'
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r scripts/ci-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_gm47_catalogue.py'
      - run: python data-preparation/scripts/gm47_catalogue.py
      - run: npm run qa:start -- --run-id gm47-ci --api-port 55471 --db-port 55472
      - run: python scripts/gm47_catalogue_check.py --qa-manifest .work/qa/gm47-ci/manifest.json > "${RUNNER_TEMP}/gm47-readback.json"
      - if: always()
        run: npm run qa:stop -- --run-id gm47-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gm47-editorial-evidence
          path: |
            ${{ runner.temp }}/gm47-readback.json
            .work/gm47-editorial/editorial-report.json
          include-hidden-files: true
