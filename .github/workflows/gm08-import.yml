name: GM-08 food importer
on:
  workflow_call:
permissions:
  contents: read
jobs:
  encoding:
    name: GM-08 cp1252 encoding regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Unit checks including cp1252 subprocess JSON success and error
        env:
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
          PYTHONIOENCODING: cp1252
          LC_ALL: C
        run: |
          python -c "import sys; print('Python:', sys.version.split()[0], 'filesystem:', sys.getfilesystemencoding(), 'stdout:', sys.stdout.encoding, 'UTF8 mode:', sys.flags.utf8_mode)"
          python -m unittest discover -s tests -p 'test_food_import.py' -v
          python -m unittest discover -s tests -p 'test_gm08_survey.py' -v
          python -m unittest discover -s tests -p 'test_gm08_real_bundle.py' -v
          python -m unittest discover -s tests -p 'test_menu_notebook.py' -v
      - name: Report final job state
        if: always()
        uses: ./.github/actions/ci-report
        with:
          name: gm08-encoding
  sql:
    name: GM-08 disposable PostgreSQL import
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Start the local Supabase project
        run: npm run backend:start
      - name: Real import, idempotency, concurrency and rollback in a disposable DB
        env:
          LC_ALL: C
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
        run: python scripts/gm08_import_check.py --report "$RUNNER_TEMP/gm08-sql-results-linux.json"
      - name: Load and query the unchanged actual pilot in a disposable DB
        env:
          LC_ALL: C
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
        run: >-
          python scripts/gm08_real_bundle_check.py
          --input supabase/seed/draft/gm08-survey-v0.4.1/bundle.json
          --report "$RUNNER_TEMP/gm08-real-bundle-results.json"
          --readback "$RUNNER_TEMP/gm08-real-bundle-readback.json"
      - name: Upload GM-08 SQL assertions and tested source hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gm08-sql-results-linux
          path: |
            ${{ runner.temp }}/gm08-sql-results-linux.json
            ${{ runner.temp }}/gm08-real-bundle-results.json
            ${{ runner.temp }}/gm08-real-bundle-readback.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the local project
        if: always()
        run: npm run backend:stop
      - name: Report final job state
        if: always()
        uses: ./.github/actions/ci-report
        with:
          name: gm08-import
