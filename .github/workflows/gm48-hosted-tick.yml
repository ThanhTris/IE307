name: GM-48 hosted tick scheduler
on:
  pull_request:
    paths:
      - '.github/workflows/gm48-hosted-tick.yml'
      - 'supabase/migrations/*_gm48_hosted_tick_schedule.sql'
      - 'supabase/rollback/*_gm48_hosted_tick_schedule.down.sql'
      - 'scripts/gm48_hosted_tick_check.py'
      - 'supabase/tests/http/GM-48.http'
permissions:
  contents: read
jobs:
  cron-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r scripts/ci-requirements.txt
      - run: npm run qa:start -- --run-id gm48-ci --api-port 55481 --db-port 55482
      - name: Inspect fallback, real Cron and concurrent tick behavior
        run: python scripts/gm48_hosted_tick_check.py --qa-manifest .work/qa/gm48-ci/manifest.json --cron
      - if: always()
        run: npm run qa:stop -- --run-id gm48-ci
