name: Decision domain
permissions:
  contents: read
on:
  workflow_call:
jobs:
  decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Separate node:test suite: GM-02 Jest only discovers .test.ts/.test.tsx.
      - run: node --test mobile/tests/decision.test.mjs mobile/tests/decisionSeeded.test.mjs
      - run: node mobile/scripts/check-decision.mjs --report /tmp/decision-actual.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: decision-domain-actual
          path: /tmp/decision-actual.json
          if-no-files-found: error
          retention-days: 14
      - name: Report final job state
        if: always()
        uses: ./.github/actions/ci-report
        with:
          name: decision-domain
