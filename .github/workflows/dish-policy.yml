name: Dish session policy v3
on:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --test mobile/tests/decision.test.mjs mobile/tests/decisionSeeded.test.mjs mobile/tests/dishPolicy.test.mjs
      - run: npm run backend:start
      - name: Actual PostgreSQL, ACL, server worker, parity and authenticated HTTP
        run: python scripts/dish_policy_sql_check.py | tee "${{ runner.temp }}/dish-policy.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dish-policy-backend
          path: ${{ runner.temp }}/dish-policy.json
          retention-days: 14
      - if: always()
        run: npm run backend:stop
      - name: Report final job state
        if: always()
        uses: ./.github/actions/ci-report
        with:
          name: legacy-dish-policy
