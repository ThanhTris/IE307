# GM-03 local foundation only. No remote ref, business schema or verified seed yet.
project_id = "gi-cung-duoc-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[realtime]
# ADR-026: the app listens to new inbox rows (migration 0053) instead of reading every few seconds.
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

# The account QA runner opts in to the GM-35 email provider configuration.
[auth.email]
enable_signup = false

[auth.rate_limit]
# token_refresh is enforced by GoTrue once the local Auth container receives
# GOTRUE_RATE_LIMIT_HEADER=X-Forwarded-For from the trusted Kong proxy.
anonymous_users = 30
token_refresh = 150

[edge_runtime]
enabled = false

[analytics]
enabled = false
