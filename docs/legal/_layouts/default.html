<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Thông tin pháp lý và hỗ trợ của ứng dụng Gì Cũng Được.">
    <title>{{ page.title | escape }} · Gì Cũng Được</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2933; background: #f6f8f5; }
      * { box-sizing: border-box; }
      body { margin: 0; line-height: 1.65; }
      header { background: #fff; border-bottom: 1px solid #dbe3dc; }
      .bar, main, footer { width: min(100% - 2rem, 52rem); margin-inline: auto; }
      .bar { min-height: 4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      .brand { color: #173c26; font-weight: 750; text-decoration: none; }
      nav { display: flex; gap: .8rem; flex-wrap: wrap; }
      nav a { color: #285f38; font-size: .92rem; }
      main { margin-block: 2rem 3rem; padding: clamp(1.25rem, 4vw, 2.5rem); background: #fff; border: 1px solid #e1e8e2; border-radius: 1rem; box-shadow: 0 8px 28px rgb(20 50 30 / 5%); }
      h1, h2, h3 { color: #173c26; line-height: 1.25; }
      h1 { font-size: clamp(1.7rem, 5vw, 2.25rem); }
      h2 { margin-top: 2rem; font-size: 1.35rem; }
      a { color: #176a37; }
      a:focus-visible { outline: 3px solid #176a37; outline-offset: 3px; border-radius: .15rem; }
      table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
      th, td { padding: .7rem; border: 1px solid #dbe3dc; text-align: left; vertical-align: top; }
      th { background: #f0f6f0; }
      blockquote { margin-inline: 0; padding: .75rem 1rem; border-left: 4px solid #4b8d5d; background: #f0f6f0; }
      footer { padding-block: 0 2rem; color: #52615a; font-size: .9rem; }
      @media (max-width: 36rem) { .bar { padding-block: .8rem; } nav { gap: .5rem .75rem; } main { margin-block: 1rem 2rem; } }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="https://thanhtris.github.io/IE307/">Gì Cũng Được</a>
        <nav aria-label="Liên kết pháp lý">
          <a href="https://thanhtris.github.io/IE307/privacy/">Quyền riêng tư</a>
          <a href="https://thanhtris.github.io/IE307/terms/">Điều khoản</a>
          <a href="https://thanhtris.github.io/IE307/delete-account/">Xóa tài khoản</a>
          <a href="https://thanhtris.github.io/IE307/support/">Hỗ trợ</a>
        </nav>
      </div>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <p>Nhà phát hành: Nguyễn Thanh Trí · <a href="mailto:23521645@gm.uit.edu.vn">23521645@gm.uit.edu.vn</a></p>
    </footer>
  </body>
</html>
